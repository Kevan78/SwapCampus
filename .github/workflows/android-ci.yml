# =============================================================================
#  CONTINUOUS INTEGRATION — SwapCampus (Kotlin Multiplatform)
#  On every push / pull request:
#    job 1 (Ubuntu): shared unit tests -> lint -> debug APK
#    job 2 (macOS):  the shared Compose UI still compiles for iOS
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a running build when a newer commit arrives on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android - test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The Gradle daemon requires JDK 25 (gradle/gradle-daemon-jvm.properties)
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Caches ~/.gradle (dependencies, wrapper) between runs -> faster builds
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests (shared commonTest on JVM + androidApp)
        run: ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew :androidApp:lintDebug
        continue-on-error: true   # report only, does not fail the build

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            androidApp/build/reports/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: swapcampus-debug-${{ github.run_number }}
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  ios:
    name: iOS - compile shared UI
    runs-on: macos-latest      # Kotlin/Native iOS targets need macOS
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Compile composeApp for the iOS simulator
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace
