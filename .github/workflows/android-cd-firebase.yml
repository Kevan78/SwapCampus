# =============================================================================
#  CONTINUOUS DELIVERY — SwapCampus Android
#  On every push to main (or manually): Fastlane runs the tests, builds a
#  release APK and uploads it to Firebase App Distribution -> testers get
#  an e-mail and install the new build on their phone.
# =============================================================================
name: CD - Firebase App Distribution

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes shown to testers (empty = last commits)"
        required: false
        default: ""

concurrency:
  group: cd-firebase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  distribute:
    name: Build & distribute to testers
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # --- Secrets (Settings > Secrets and variables > Actions) ---
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}          # optional
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}      # optional
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}                      # optional
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}                # optional
      # --- Non-secret configuration ---
      FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'classmates' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout code (full history for the changelog)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check required secrets
        run: |
          if [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_APP_ID or FIREBASE_SERVICE_ACCOUNT_JSON secret"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Ruby + Fastlane (bundle install, cached)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Write Firebase service account to a temp file
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "FIREBASE_SERVICE_ACCOUNT_PATH=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Decode release keystore (only if the secret exists)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fastlane - test, build release, upload to Firebase
        run: bundle exec fastlane android distribute
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}

      - name: Keep the release APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swapcampus-release-${{ github.run_number }}
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/release.jks"
